[workspace]
resolver = "2"
members = [
    "crates/pg-client",
    "examples/*",
    "tests/integration",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Djudicael/pg_client"

[workspace.dependencies]
# ── WASI 0.3 bindings ──
wasip3 = "0.8"

# ── Byte handling ──
bytes = "1"            # Efficient byte buffer manipulation (zero-copy slices)

# ── Crypto (pure Rust, WASI-compatible) ──
sha2 = "0.11"          # SHA-256 for SCRAM auth
hmac = "0.13"          # HMAC for SCRAM auth
pbkdf2 = "0.13"        # PBKDF2 key derivation for SCRAM
md-5 = "0.11"          # MD5 for legacy PG auth
base64 = "0.23"        # Base64 for SCRAM encoding

# ── TLS ──
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"            # Mozilla CA roots (embedded, no filesystem needed)

# ── Random ──
getrandom = "0.4"      # CSPRNG interface — v0.4+ has WASI P2 auto-detection

# ── Error handling ──
thiserror = "2"        # Derive Error trait

# ── Logging ──
tracing = "0.1"        # Structured logging / instrumentation

# ── Async utilities ──
futures-concurrency = "7"  # Async combinators (join, race, etc.) — no runtime dep
async-channel = "2"    # Async channel for connection pooling

# ── Optional type integrations ──
uuid = "1"
serde_json = "1"
chrono = "0.4"

# ── Dev dependencies ──
pretty_assertions = "1"
proptest = "1"         # Property-based testing for protocol/types
tempfile = "3"         # Temporary directories for integration tests
tokio = { version = "1", features = ["rt", "macros"] }
fallible-iterator = "0.3"
